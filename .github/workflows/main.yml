on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - CHANGELOG.md

jobs:
  release:
    name: Release empty module
    runs-on:
      - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build arm64
        shell: bash
        run: |
          sed -i "s/pack_arch=.*/pack_arch=\"arm64\"/" ./files.config
          bash ./pack.sh -c

      - name: Build amd64
        shell: bash
        run: |
          sed -i "s/pack_arch=.*/pack_arch=\"amd64\"/" ./files.config
          bash ./pack.sh -c

      - name: Save Artifacts ARM64
        uses: actions/upload-artifact@v4
        with:
          name: release-arm64
          path: release-arm64

      - name: Save Artifacts AMD64
        uses: actions/upload-artifact@v4
        with:
          name: release-amd64
          path: release-amd64

      - name: Save Version
        uses: actions/upload-artifact@v4
        with:
          name: version.txt
          path: version
      
      - name: Upload to Telegram Channel
        env:
          CHANNEL: ${{ secrets.CHANNEL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          VERSION=$(cut -d : -f 2- ./version)
          MODULE_VERSION=$(sed -n 's/^version=//p' ./module.prop)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --format=%s | cut -c 1-200)
          OUT_DIR="release/"
          arm64=$(find "$OUT_DIR" -name "MFM-arm64-v*.zip")
          caption=$(printf '%s\n' \
            "📦 Mihomo For Magisk — Official Release / 正式版" \
            "" \
            "Release channel / 正式发布渠道" \
            "" \
            "Module / 模块: ${MODULE_VERSION}" \
            "Mihomo / 内核: ${VERSION}" \
            "Architecture / 架构: ARM64" \
            "Branch / 分支: ${GITHUB_REF_NAME}" \
            "Commit / 提交: ${COMMIT_SHA}" \
            "${COMMIT_SUBJECT}" \
            "" \
            "#MFM #Release #ARM64" | jq -Rsr @uri)
          if [ -n "$BOT_TOKEN" ]; then
            curl -s -X POST \
                  -H "Content-Type:multipart/form-data"\
                  -F document=@"$arm64" \
                  "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument?chat_id=${CHANNEL}&caption=${caption}"
          fi
          
